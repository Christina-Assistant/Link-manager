name: Deploy Link-manager to Aliyun ECS

on:
  workflow_dispatch:

concurrency:
  group: deploy-link-manager
  cancel-in-progress: false

env:
  ACR_REGISTRY: ${{ vars.ACR_REGISTRY || secrets.ACR_REGISTRY }}
  ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE || secrets.ACR_NAMESPACE }}
  ACR_IMAGE: link-manager
  MANAGER_PORT: 5173

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build check
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate credentials
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY || secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE || secrets.ACR_NAMESPACE }}
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USERNAME: ${{ secrets.ECS_USERNAME }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
        run: |
          for v in ACR_USERNAME ACR_PASSWORD ACR_REGISTRY ACR_NAMESPACE ECS_HOST ECS_USERNAME ECS_SSH_KEY; do
            if [ -z "${!v}" ]; then echo "Missing $v"; exit 1; fi
          done
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build and push manager image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: VITE_API_URL=http://${{ secrets.ECS_HOST }}:8090/api/v1
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.ACR_IMAGE }}:latest
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.ACR_IMAGE }}:${{ github.sha }}
      - name: Write SSH key
        env:
          SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' | sed 's/[[:space:]]*$//' > "$HOME/.ssh/ecs_deploy"
          chmod 600 "$HOME/.ssh/ecs_deploy"
          ssh-keygen -y -f "$HOME/.ssh/ecs_deploy" >/dev/null
      - name: Deploy on the shared ECS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USERNAME }}
          key_path: /home/runner/.ssh/ecs_deploy
          script: |
            set -e
            docker login ${{ env.ACR_REGISTRY }} -u '${{ secrets.ACR_USERNAME }}' -p '${{ secrets.ACR_PASSWORD }}'
            docker pull ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.ACR_IMAGE }}:latest
            docker rm -f link-manager 2>/dev/null || true
            docker run -d --name link-manager --restart unless-stopped -p ${{ env.MANAGER_PORT }}:80 ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.ACR_IMAGE }}:latest
            sleep 2
            curl -fsS http://localhost:${{ env.MANAGER_PORT }}/ >/dev/null
            docker image prune -f
            docker ps --filter name=link-manager
