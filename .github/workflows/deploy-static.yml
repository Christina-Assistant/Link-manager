name: Deploy Link-manager to Aliyun ECS

on:
  workflow_dispatch:

concurrency:
  group: deploy-link-manager
  cancel-in-progress: false

env:
  MANAGER_PORT: 5173
  DEPLOY_DIR: citylink/link-manager

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build production frontend
        env:
          VITE_API_URL: http://${{ secrets.ECS_HOST }}:8090/api/v1
        run: npm run build
      - name: Validate ECS credentials
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USERNAME: ${{ secrets.ECS_USERNAME }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
        run: |
          for v in ECS_HOST ECS_USERNAME ECS_SSH_KEY; do
            if [ -z "${!v}" ]; then echo "Missing $v"; exit 1; fi
          done
      - name: Write SSH key
        env:
          SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' | sed 's/[[:space:]]*$//' > "$HOME/.ssh/ecs_deploy"
          chmod 600 "$HOME/.ssh/ecs_deploy"
          ssh-keygen -y -f "$HOME/.ssh/ecs_deploy" >/dev/null
      - name: Upload static files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USERNAME }}
          key_path: /home/runner/.ssh/ecs_deploy
          port: 22
          source: "dist,nginx.conf"
          target: ~/${{ env.DEPLOY_DIR }}
      - name: Start manager on shared ECS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USERNAME }}
          key_path: /home/runner/.ssh/ecs_deploy
          port: 22
          script: |
            set -e
            docker rm -f link-manager 2>/dev/null || true
            docker run -d --name link-manager --restart unless-stopped \
              -p ${{ env.MANAGER_PORT }}:80 \
              -v "$HOME/${{ env.DEPLOY_DIR }}/dist:/usr/share/nginx/html:ro" \
              -v "$HOME/${{ env.DEPLOY_DIR }}/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
              nginx:1.27-alpine
            sleep 2
            curl -fsS http://localhost:${{ env.MANAGER_PORT }}/ >/dev/null
            docker ps --filter name=link-manager
