[package]
name = "link-manager"
version = "0.1.0"
description = "Local control center for City Link"
authors = ["Link team"]
edition = "2021"

[lib]
name = "link_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

